<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GuideNurse</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9; /* Soft background for desktop */
    }
    /* Native App Scroll Container Physics */
    .app-scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Hide scrollbars for clean UI */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Smooth transition for active states */
    .active-feedback:active {
      transform: scale(0.98);
      background-color: #f8fafc;
    }
    .btn-press:active {
      transform: scale(0.96);
      opacity: 0.9;
    }
    /* Loading dots animation */
    .dot-pulse {
      animation: pulse-dot 1.4s infinite ease-in-out both;
    }
    .dot-pulse-1 { animation-delay: -0.32s; }
    .dot-pulse-2 { animation-delay: -0.16s; }
    @keyframes pulse-dot {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="antialiased h-[100dvh] w-full flex justify-center items-center overflow-hidden md:p-6 text-slate-800">

  <!-- Mobile Device Frame -->
  <div class="w-full h-full max-w-[420px] bg-slate-50 flex flex-col relative md:shadow-2xl md:rounded-[2.5rem] md:h-[92dvh] overflow-hidden ring-1 ring-slate-900/5">
    
    <!-- SYSTEM BANNER NOTIFICATION -->
    <div id="system-notification" class="hidden p-3 text-sm font-medium text-center absolute top-0 left-0 right-0 z-50 shadow-md transition-all duration-300 flex items-center justify-center space-x-2">
      <span id="notif-text">System Status Update</span>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <div id="app-viewport" class="flex flex-col h-full flex-grow overflow-hidden bg-slate-50">
      <!-- Injected by Controller -->
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav id="bottom-navigation" class="hidden flex-shrink-0 bg-white border-t border-slate-200 flex justify-around pb-safe z-30 px-2 py-1 relative">
      <button onclick="window.switchTab('search')" id="nav-search" class="nav-btn flex flex-col items-center flex-1 pt-2 pb-1.5 transition-colors focus:outline-none text-slate-400">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <span class="text-[10px] font-medium">Search</span>
      </button>
      <button onclick="window.switchTab('formulary')" id="nav-formulary" class="nav-btn flex flex-col items-center flex-1 pt-2 pb-1.5 transition-colors focus:outline-none text-slate-400">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        <span class="text-[10px] font-medium">Formulary</span>
      </button>
      <button onclick="window.switchTab('tools')" id="nav-tools" class="nav-btn flex flex-col items-center flex-1 pt-2 pb-1.5 transition-colors focus:outline-none text-slate-400">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
        <span class="text-[10px] font-medium">Tools</span>
      </button>
      <button onclick="window.switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center flex-1 pt-2 pb-1.5 transition-colors focus:outline-none text-slate-400">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        <span class="text-[10px] font-medium">Settings</span>
      </button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      onSnapshot,
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBHAPAy9Z4kQrWod7Pa0MMrrpppeMpiqZA",
      authDomain: "guidenurse-46052.firebaseapp.com",
      databaseURL: "https://guidenurse-46052-default-rtdb.firebaseio.com",
      projectId: "guidenurse-46052",
      storageBucket: "guidenurse-46052.firebasestorage.app",
      messagingSenderId: "702106825259",
      appId: "1:702106825259:web:f108a2ff9846e00febf06e",
      measurementId: "G-ECJ7G0MMQY"
    };

    const appId = "guidenurse-46052";
    let app, auth, db;
    let firebaseActive = false;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseActive = true;
    } catch (error) {
      console.error("Database connection fault.", error);
    }

    // Application State
    const state = {
      user: null,
      passcode: localStorage.getItem('rn_passcode') || '',
      isLocked: true,
      passcodeInput: '',
      passcodeError: '',
      setupStep: localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1',
      tempPasscode: '',
      groqApiKey: localStorage.getItem('rn_groq_key') || '',
      activeTab: 'search',
      selectedDrug: null,
      clinicalDrugs: JSON.parse(localStorage.getItem('rn_local_drugs') || '[]'),
      searchQuery: '',
      apiLoading: false,
      apiError: null,
      calcType: 'drip',
      calcInput: { volume: '', time: '', dropFactor: '15', doseOrdered: '', weight: '', concentrationVal: '', concentrationVol: '', timeUnit: 'min' },
      calcResult: null,
      assistantPrompt: '',
      assistantResponse: '',
      assistantLoading: false,
      authEmail: '',
      authPassword: '',
      isSignUp: false,
      authLoading: false,
      authError: ''
    };

    // System Notification Manager
    function showBanner(message, type = 'success') {
      const banner = document.getElementById('system-notification');
      const text = document.getElementById('notif-text');
      if (!banner || !text) return;

      text.textContent = message;
      banner.className = `p-4 text-sm font-medium text-center absolute top-0 left-0 right-0 z-50 shadow-lg transition-all duration-300 flex items-center justify-center space-x-2 ${
        type === 'success' ? 'bg-emerald-600 text-white' : 
        type === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'
      }`;
      banner.classList.remove('hidden');

      setTimeout(() => {
        banner.classList.add('hidden');
      }, 3500);
    }

    // Auth Listener
    if (firebaseActive) {
      onAuthStateChanged(auth, (authUser) => {
        state.user = authUser;
        if (authUser) {
          state.isLocked = true;
          state.setupStep = localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1';
          syncFirestoreFormulary();
        } else {
          state.isLocked = true;
        }
        renderApp();
      });
    }

    // Firestore Sync
    function syncFirestoreFormulary() {
      if (!firebaseActive || !state.user) return;
      const drugsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'drugs');
      
      onSnapshot(drugsCollection, 
        (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            list.push({ id: doc.id, ...doc.data() });
          });
          
          const localDrugs = JSON.parse(localStorage.getItem('rn_local_drugs') || '[]');
          const merged = [...list];
          localDrugs.forEach(localD => {
            if (!merged.find(m => m.genericName.toLowerCase() === localD.genericName.toLowerCase())) {
              merged.push(localD);
            }
          });
          state.clinicalDrugs = merged;
          localStorage.setItem('rn_local_drugs', JSON.stringify(merged));
          renderApp();
        },
        (error) => {
          console.error("Firestore sync error:", error);
        }
      );
    }

    async function fetchWithRetry(url, options, maxRetries = 5) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errText}`);
          }
          return await response.json();
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          const delay = Math.pow(2, i) * 1000;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    // AI Monograph Generation
    async function handleAIQuery(queryName) {
      if (!queryName.trim()) return;
      
      const apiKey = state.groqApiKey; 
      if (!apiKey || apiKey === "") {
        state.apiError = "Missing API Key. Please add your Groq API Key in the Settings tab.";
        renderApp();
        return;
      }

      state.apiLoading = true;
      state.apiError = null;
      renderApp();

      const jsonExample = {
        "genericName": "Full generic drug name",
        "brandNames": ["Brand A", "Brand B"],
        "therapeuticClass": "Detailed therapeutic and pharmacologic class",
        "indications": ["Detailed clinical indication 1", "Detailed clinical indication 2", "Detailed clinical indication 3", "Detailed clinical indication 4"],
        "highAlert": true,
        "blackBoxWarning": "Detailed multi-sentence paragraph explaining the FDA black box warning. If none, write 'None'.",
        "mechanismOfAction": "Comprehensive multi-sentence paragraph detailing the exact molecular and physiological mechanism of action.",
        "administration": {
          "routes": ["IV Push", "Continuous IV", "PO"],
          "ivCompatibility": "Exhaustive paragraph detailing primary IV compatibilities, approved diluents (e.g. NS, D5W), and line requirements (e.g. Central line preferred).",
          "infusionRate": "Exhaustive paragraph covering maximum infusion rates, standard titration, and pushing instructions.",
          "criticalActions": ["Critical safety action 1", "Critical safety action 2", "Critical safety action 3", "Critical safety action 4"]
        },
        "monitoring": {
          "vitalSigns": ["Vital parameter 1", "Vital parameter 2", "Vital parameter 3", "Vital parameter 4"],
          "labValues": ["Specific lab assay 1", "Specific lab assay 2", "Specific lab assay 3", "Specific lab assay 4"],
          "clinicalSigns": ["Adverse clinical sign 1", "Adverse clinical sign 2", "Adverse clinical sign 3", "Adverse clinical sign 4"]
        },
        "interactions": ["Major drug interaction 1", "Major drug interaction 2", "Major drug interaction 3", "Major drug interaction 4"],
        "contraindications": ["Absolute contraindication 1", "Absolute contraindication 2", "Relative contraindication 1", "Relative contraindication 2"],
        "patientEducation": ["Education point 1", "Education point 2", "Education point 3", "Education point 4"],
        "recentResearch": "Comprehensive multi-sentence paragraph summarizing current clinical consensus, recent advisories, or updated guidelines."
      };

      const systemPrompt = `You are an authoritative clinical pharmacology expert. Design EXHAUSTIVE, HIGHLY DETAILED medical monographs for Registered Nurses. Focus exclusively on active clinical practice parameters, patient safety protocols, IV infusion guidelines, rate restrictions, lab monitoring schedules, and therapeutic drug-drug interactions. 
      
      CRITICAL INSTRUCTION: Do NOT be brief. You MUST write full, comprehensive, multi-sentence paragraphs for text fields. You MUST provide at least 4 to 6 long, detailed points for all lists.
      
      Output ONLY valid JSON. The JSON MUST use these exact keys and format, replacing the placeholder text with your exhaustive clinical data: ${JSON.stringify(jsonExample)}`;
      
      const userPrompt = `Synthesize an EXHAUSTIVE, in-depth clinical monograph and critical safety criteria for: "${queryName}". Include precise monitoring metrics, specific lab values, and comprehensive safety protocols.`;

      const payload = {
        model: "llama-3.3-70b-versatile",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ],
        response_format: { type: "json_object" },
        temperature: 0.2,
        max_tokens: 4000
      };

      try {
        const resultData = await fetchWithRetry(
          `https://api.groq.com/openai/v1/chat/completions`,
          {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify(payload)
          }
        );

        const parsedText = resultData.choices?.[0]?.message?.content;
        if (!parsedText) throw new Error("No response from AI server.");

        const cleanText = parsedText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const generatedDrug = JSON.parse(cleanText);

        const safeGenericName = generatedDrug.genericName || queryName || "Unknown Drug";

        const drugWithMeta = {
          genericName: safeGenericName,
          brandNames: Array.isArray(generatedDrug.brandNames) ? generatedDrug.brandNames : [],
          therapeuticClass: generatedDrug.therapeuticClass || "Unclassified Therapy",
          indications: Array.isArray(generatedDrug.indications) ? generatedDrug.indications : ["Refer to standard protocols"],
          highAlert: !!generatedDrug.highAlert,
          blackBoxWarning: generatedDrug.blackBoxWarning || "None",
          mechanismOfAction: generatedDrug.mechanismOfAction || "Mechanism not specified.",
          administration: {
            routes: Array.isArray(generatedDrug.administration?.routes) ? generatedDrug.administration.routes : ["IV"],
            ivCompatibility: generatedDrug.administration?.ivCompatibility || "Verify with institutional pharmacy.",
            infusionRate: generatedDrug.administration?.infusionRate || "Follow facility protocols.",
            criticalActions: Array.isArray(generatedDrug.administration?.criticalActions) ? generatedDrug.administration.criticalActions : ["Perform secondary check."]
          },
          monitoring: {
            vitalSigns: Array.isArray(generatedDrug.monitoring?.vitalSigns) ? generatedDrug.monitoring.vitalSigns : ["Standard vitals assessment"],
            labValues: Array.isArray(generatedDrug.monitoring?.labValues) ? generatedDrug.monitoring.labValues : ["Standard metabolic panel"],
            clinicalSigns: Array.isArray(generatedDrug.monitoring?.clinicalSigns) ? generatedDrug.monitoring.clinicalSigns : ["Monitor for adverse signs"]
          },
          interactions: Array.isArray(generatedDrug.interactions) ? generatedDrug.interactions : ["Cross-reference compatibility database."],
          contraindications: Array.isArray(generatedDrug.contraindications) ? generatedDrug.contraindications : ["Review full patient history."],
          patientEducation: Array.isArray(generatedDrug.patientEducation) ? generatedDrug.patientEducation : ["Advise patient to report discomfort."],
          recentResearch: generatedDrug.recentResearch || "Consult primary literature.",
          id: safeGenericName.toLowerCase().replace(/\s+/g, '-'),
          createdAt: new Date().toISOString(),
          references: [{ title: "Primary Monograph & Safety Protocols", uri: "" }]
        };

        if (firebaseActive && state.user) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'drugs', drugWithMeta.id);
            await setDoc(docRef, drugWithMeta);
          } catch (fsErr) {
            console.error("Cloud Sync Warning", fsErr);
          }
        }

        const updatedLocal = [drugWithMeta, ...state.clinicalDrugs.filter(d => d.id !== drugWithMeta.id)];
        localStorage.setItem('rn_local_drugs', JSON.stringify(updatedLocal));
        state.clinicalDrugs = updatedLocal;
        state.selectedDrug = drugWithMeta;
        state.searchQuery = '';
        showBanner(`${drugWithMeta.genericName} generated.`, "success");
      } catch (err) {
        console.error("Synthesis Exception:", err);
        state.apiError = "Search failed. " + (err.message || "Please try again.");
      } finally {
        state.apiLoading = false;
        renderApp();
      }
    }

    // AI Clinical Scenario Inquiry
    async function handleAssistantQuery() {
      if (!state.assistantPrompt.trim()) return;
      const apiKey = state.groqApiKey;
      if (!apiKey || apiKey === "") {
        state.assistantResponse = "Missing API Key. Please add your Groq API Key in the Settings tab.";
        renderApp();
        return;
      }

      state.assistantLoading = true;
      state.assistantResponse = '';
      renderApp();

      const systemPrompt = `You are an expert Clinical Pharmacologist and Nursing Educator. Analyze the scenario using standard clinical, evidence-based guidelines. Respond in a brief, clear, and professional clinical format. Focus on safe parameters and immediate clinical workflows.`;

      const payload = {
        model: "llama-3.3-70b-versatile",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: state.assistantPrompt }
        ],
        temperature: 0.3
      };

      try {
        const response = await fetchWithRetry(
          `https://api.groq.com/openai/v1/chat/completions`,
          {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify(payload)
          }
        );
        state.assistantResponse = response.choices?.[0]?.message?.content || "Unable to process query.";
      } catch (e) {
        state.assistantResponse = "Connection error. Please try again.";
      } finally {
        state.assistantLoading = false;
        renderApp();
      }
    }

    // Delete Drug Functionality
    window.deleteDrug = async (drugId) => {
      // Remove locally immediately for snappy UI
      state.clinicalDrugs = state.clinicalDrugs.filter(d => d.id !== drugId);
      localStorage.setItem('rn_local_drugs', JSON.stringify(state.clinicalDrugs));
      renderApp();

      // Remove from Firestore if connected
      if (firebaseActive && state.user) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'drugs', drugId));
        } catch (err) {
          console.error("Failed to delete from cloud:", err);
          showBanner("Removed locally, but cloud delete failed.", "error");
          return;
        }
      }
      showBanner("Drug removed from formulary.", "success");
    };

    // Helper to update bottom nav colors safely
    function updateBottomNavUI() {
      const tabs = ['search', 'formulary', 'tools', 'settings'];
      tabs.forEach(tab => {
        const el = document.getElementById(`nav-${tab}`);
        if (el) {
          if (state.activeTab === tab) {
            el.classList.remove('text-slate-400');
            el.classList.add('text-blue-600');
          } else {
            el.classList.remove('text-blue-600');
            el.classList.add('text-slate-400');
          }
        }
      });
    }

    // Main App Rendering
    function renderApp() {
      const container = document.getElementById('app-viewport');
      const bottomNav = document.getElementById('bottom-navigation');
      if (!container) return;

      const queryLower = (state.searchQuery || "").toLowerCase();
      const filteredDrugs = state.clinicalDrugs.filter(d => {
        const genName = d.genericName || "";
        const brandNames = Array.isArray(d.brandNames) ? d.brandNames : [];
        const tClass = d.therapeuticClass || "";
        return genName.toLowerCase().includes(queryLower) ||
               brandNames.some(b => (b || "").toLowerCase().includes(queryLower)) ||
               tClass.toLowerCase().includes(queryLower);
      });

      // ----------------------------------------------------
      // GATE 1: AUTHENTICATION
      // ----------------------------------------------------
      if (!state.user) {
        bottomNav.classList.add('hidden');
        container.innerHTML = `
          <div class="flex flex-col justify-between h-full bg-slate-50 p-6 overflow-y-auto">
            <div class="mt-16 flex flex-col items-center">
              <div class="w-20 h-20 bg-blue-600 rounded-[1.5rem] shadow-lg shadow-blue-600/30 flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
              </div>
              <h1 class="text-3xl font-bold text-slate-900 tracking-tight">GuideNurse</h1>
              <p class="text-sm text-slate-500 font-medium mt-2">Clinical Pharmacology Reference</p>
            </div>

            <div class="w-full max-w-sm mx-auto bg-white p-6 rounded-3xl shadow-sm border border-slate-100 my-auto">
              <form id="auth-form" class="space-y-4">
                <div>
                  <label class="text-xs font-semibold text-slate-600 ml-1">Email Address</label>
                  <input type="email" id="auth-email-input" required placeholder="nurse@hospital.org" value="${state.authEmail}"
                    class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" />
                </div>
                <div>
                  <label class="text-xs font-semibold text-slate-600 ml-1">Password</label>
                  <input type="password" id="auth-password-input" required placeholder="••••••••" value="${state.authPassword}"
                    class="mt-1 w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" />
                </div>

                ${state.authError ? `
                  <div class="p-3 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl flex items-start space-x-2">
                    <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                    <p>${state.authError}</p>
                  </div>
                ` : ''}

                <button type="submit" class="btn-press w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl text-sm transition-all shadow-md shadow-blue-600/20 mt-2">
                  ${state.authLoading ? "Verifying..." : state.isSignUp ? "Create Account" : "Secure Login"}
                </button>
              </form>

              <div class="text-center mt-6">
                <button type="button" id="auth-mode-toggle" class="text-xs text-slate-500 hover:text-blue-600 font-medium transition-colors">

          if (wInput) wInput.value = state.calcInput.weight;
          if (cvInput) cvInput.value = state.calcInput.concentrationVal;
          if (cpInput) cpInput.value = state.calcInput.concentrationVol;
          doInput?.addEventListener('input', (e) => { state.calcInput.doseOrdered = e.target.value; });
          tuSelect?.addEventListener('change', (e) => { state.calcInput.timeUnit = e.target.value; });
          wInput?.addEventListener('input', (e) => { state.calcInput.weight = e.target.value; });
          cvInput?.addEventListener('input', (e) => { state.calcInput.concentrationVal = e.target.value; });
          cpInput?.addEventListener('input', (e) => { state.calcInput.concentrationVol = e.target.value; });
        } else {
          const promptInput = document.getElementById('assistant-prompt-input');
          promptInput?.addEventListener('input', (e) => { state.assistantPrompt = e.target.value; });
        }
      }

      // TAB: SETTINGS
      if (state.activeTab === 'settings') {

    // Dynamic Monograph Detail Drawer

          <!-- Content Scroll Area -->

            ${drug.blackBoxWarning && drug.blackBoxWarning.toLowerCase() !== 'none' ? `

            ${window.drugTabState === 'summary' ? `

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

                    <li class="text-sm text-slate-700 font-medium flex items-start space-x-2">

                    <li class="text-sm text-slate-700 font-medium flex items-start space-x-2">
                      <span class="text-blue-500 mt-1">•</span>

                <div class="bg-slate-800 p-5 rounded-2xl shadow-sm text-white">
                  <h3 class="text-xs font-bold text-blue-300 uppercase tracking-wide mb-3 border-b border-slate-700 pb-2">Immediate Safety Actions</h3>
                  <ul class="space-y-2.5">
                    <li class="text-sm font-medium leading-relaxed flex items-start space-x-2">
                      <svg class="w-4 h-4 text-emerald-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                      <span>${drug.administration.criticalActions[0] || 'Double-check calculations.'}</span>
                    </li>
                    ${drug.administration.criticalActions[1] ? `
                      <li class="text-sm font-medium leading-relaxed flex items-start space-x-2">
                        <svg class="w-4 h-4 text-emerald-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        <span>${drug.administration.criticalActions[1]}</span>

            ${window.drugTabState === 'admin' ? `
              <div class="space-y-5 animate-fade-in">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">Approved Routes</h3>
                  <div class="flex flex-wrap gap-2">
                    ${drug.administration.routes.map(route => `
                      <span class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1.5 rounded-lg border border-blue-100">${route}</span>
                    `).join('')}

                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">IV Compatibility & Setup</h3>
                  <p class="text-sm text-slate-800 font-medium leading-relaxed">${drug.administration.ivCompatibility}</p>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Infusion Rate Parameters</h3>
                  <p class="text-sm text-slate-800 font-medium leading-relaxed">${drug.administration.infusionRate}</p>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Preparation Directives</h3>
                  <ul class="space-y-3">
                    ${drug.administration.criticalActions.map(action => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${action}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'info' ? `
              <div class="space-y-5 animate-fade-in">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Therapeutic Indications</h3>
                  <ul class="space-y-3">
                    ${drug.indications.map(ind => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${ind}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Mechanism of Action</h3>
                  <p class="text-sm text-slate-800 font-medium leading-relaxed">${drug.mechanismOfAction}</p>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'monitoring' ? `
              <div class="space-y-5 animate-fade-in">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Hemodynamic Assessment</h3>
                  <ul class="space-y-3">
                    ${drug.monitoring.vitalSigns.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Required Labs</h3>
                  <ul class="space-y-3">
                    ${drug.monitoring.labValues.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Adverse Clinical Signs</h3>
                  <ul class="space-y-3">
                    ${drug.monitoring.clinicalSigns.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'interactions' ? `
              <div class="space-y-5 animate-fade-in">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-red-500 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Drug Interactions</h3>
                  <ul class="space-y-3">
                    ${drug.interactions.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-red-500 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Contraindications</h3>
                  <ul class="space-y-3">
                    ${drug.contraindications.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'research' ? `
              <div class="space-y-5 animate-fade-in">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Literature Consensus</h3>
                  <p class="text-sm text-slate-800 font-medium leading-relaxed">${drug.recentResearch}</p>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3 border-b border-slate-100 pb-2">Patient Education</h3>
                  <ul class="space-y-3">
                    ${drug.patientEducation.map(item => `
                      <li class="text-sm text-slate-700 font-medium leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>

                </div>

            ` : ''}

          </div>
        </div>
      `;
    }

    window.switchTab = (tabId) => {
      state.activeTab = tabId;
      state.selectedDrug = null;
      renderApp();
    };

    window.selectDrug = (drugId) => {
      state.selectedDrug = state.clinicalDrugs.find(d => d.id === drugId);
      window.drugTabState = 'summary';
      renderApp();
    };

    window.closeDrugDetail = () => {
      state.selectedDrug = null;
      renderApp();
    };

    window.setDrugDetailTab = (tabId) => {
      window.drugTabState = tabId;
      if (state.selectedDrug) {
        const container = document.getElementById('app-viewport');
        renderDrugDetail(state.selectedDrug, container);
      }
    };

    window.setCalcType = (calcId) => {
      state.calcType = calcId;
      state.calcResult = null;
      renderApp();
    };

    window.runCalculation = () => {
      if (state.calcType === 'drip') {
        const vol = parseFloat(document.getElementById('calc-vol')?.value);
        const hrs = parseFloat(document.getElementById('calc-time')?.value);
        const df = parseFloat(document.getElementById('calc-drop')?.value);

        if (isNaN(vol) || isNaN(hrs) || isNaN(df) || vol <= 0 || hrs <= 0) {
          state.calcResult = { error: "Please enter valid numbers." };
          renderApp(); return;
        }
        state.calcInput.volume = vol; state.calcInput.time = hrs; state.calcInput.dropFactor = df;

        const mlPerHour = Math.round((vol / hrs) * 10) / 10;
        const gttsPerMin = Math.round((vol * df) / (hrs * 60));
        state.calcResult = { type: 'drip', mlPerHour, summary: `Infuse at ${mlPerHour} mL/hr (approx. ${gttsPerMin} gtts/min at ${df} drops/mL).` };
      } else {
        const dose = parseFloat(document.getElementById('calc-dose')?.value);
        const unit = document.getElementById('calc-unit')?.value;
        const wt = parseFloat(document.getElementById('calc-weight')?.value);
        const concV = parseFloat(document.getElementById('calc-conc-val')?.value);
        const concVol = parseFloat(document.getElementById('calc-conc-vol')?.value);

        if (isNaN(dose) || isNaN(concV) || isNaN(concVol) || dose <= 0 || concV <= 0 || concVol <= 0) {
          state.calcResult = { error: "Mass and concentration required." };
          renderApp(); return;
        }
        state.calcInput.doseOrdered = dose; state.calcInput.timeUnit = unit; state.calcInput.weight = wt;
        state.calcInput.concentrationVal = concV; state.calcInput.concentrationVol = concVol;

        let hourlyDose = dose;
        if (unit === 'min') hourlyDose = dose * 60;
        if (wt && wt > 0) hourlyDose = hourlyDose * wt;

        const mlPerHour = Math.round(((hourlyDose / concV) * concVol) * 100) / 100;
        state.calcResult = { type: 'dose', mlPerHour, summary: `Deliver at ${mlPerHour} mL/hr to meet target dose of ${dose} ${wt ? 'mcg/kg/min' : 'mg/hr'}.` };
      }
      renderApp();
    };

    window.runAssistantQuery = () => { handleAssistantQuery(); };

    window.saveApiKey = () => {
      const keyInput = document.getElementById('settings-api-key').value.trim();
      localStorage.setItem('rn_groq_key', keyInput);
      state.groqApiKey = keyInput;
      showBanner("API Key saved to device.", "success");
    };

    window.pressPIN = (key) => {
      state.passcodeError = '';
      if (key === 'delete') {
        state.passcodeInput = state.passcodeInput.slice(0, -1);
        renderApp(); return;
      }
      if (state.passcodeInput.length >= 4) return;
      state.passcodeInput += key;
      renderApp();

      if (state.passcodeInput.length === 4) {
        if (state.setupStep === 'setup-1') {
          state.tempPasscode = state.passcodeInput;
          state.setupStep = 'setup-2';
          state.passcodeInput = '';
          showBanner("Confirm your new PIN", "success");
        } else if (state.setupStep === 'setup-2') {
          if (state.passcodeInput === state.tempPasscode) {
            localStorage.setItem('rn_passcode', state.passcodeInput);
            state.passcode = state.passcodeInput;
            state.setupStep = 'enter';
            state.isLocked = false;
            state.passcodeInput = '';
          } else {
            state.passcodeError = "PINs did not match. Try again.";
            state.setupStep = 'setup-1';
            state.passcodeInput = '';
            state.tempPasscode = '';
          }
        } else if (state.setupStep === 'enter') {
          if (state.passcodeInput === state.passcode) {
            state.isLocked = false;
            state.passcodeInput = '';
          } else {
            state.passcodeError = "Incorrect PIN.";
            state.passcodeInput = '';
          }
        }
        renderApp();
      }
    };

    window.signoutUser = async () => {
      try {
        await signOut(auth);
        state.user = null; state.isLocked = true; state.passcodeInput = '';
        renderApp();
      } catch (err) { console.error("Logout failed", err); }
    };

    window.clearPasscode = () => {
      localStorage.removeItem('rn_passcode');
      state.passcode = ''; state.setupStep = 'setup-1'; state.passcodeInput = ''; state.isLocked = true;
      renderApp();
      showBanner("PIN reset successfully.", "success");
    };

    // Initial render
    renderApp();
  </script>
</body>
</html>
