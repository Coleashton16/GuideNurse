<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Reference Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Medical Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .mono-font {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .scrollbar-none {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#070a13',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased min-h-screen flex justify-center items-start">

  <!-- Mobile Frame Emulator -->
  <div class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col justify-between relative shadow-2xl border-x border-slate-200/80 overflow-x-hidden pb-20">
    
    <!-- SYSTEM BANNER NOTIFICATION -->
    <div id="system-notification" class="hidden p-3 text-xs font-semibold text-center absolute top-0 left-0 right-0 z-50 shadow-md transition-all duration-350 flex items-center justify-center space-x-2">
      <span id="notif-text">System Status Update</span>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <div id="app-viewport" class="flex flex-col h-full flex-grow">
      <!-- Dynamic Views Rendered Here via Module Controller -->
    </div>

    <!-- BOTTOM CLINICAL NAVIGATION DRAWER (Only visible when unlocked) -->
    <nav id="bottom-navigation" class="hidden fixed bottom-0 max-w-md w-full bg-slate-950 text-white flex justify-around py-3 px-2 border-t border-slate-800 shadow-xl z-45 rounded-t-xl">
      <button onclick="window.switchTab('search')" id="nav-search" class="flex flex-col items-center flex-1 py-1 text-teal-400 font-bold transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" strokeLinejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Inquiry</span>
      </button>
      <button onclick="window.switchTab('formulary')" id="nav-formulary" class="flex flex-col items-center flex-1 py-1 text-slate-500 hover:text-slate-300 transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Index</span>
      </button>
      <button onclick="window.switchTab('tools')" id="nav-tools" class="flex flex-col items-center flex-1 py-1 text-slate-500 hover:text-slate-300 transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Calculations</span>
      </button>
      <button onclick="window.switchTab('settings')" id="nav-settings" class="flex flex-col items-center flex-1 py-1 text-slate-500 hover:text-slate-300 transition-all">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Settings</span>
      </button>
    </nav>

  </div>

  <!-- FIREBASE AND SYSTEM LOGIC MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Standard Developer Configuration Project: guidenurse-46052
    const firebaseConfig = {
      apiKey: "AIzaSyBHAPAy9Z4kQrWod7Pa0MMrrpppeMpiqZA",
      authDomain: "guidenurse-46052.firebaseapp.com",
      projectId: "guidenurse-46052",
      storageBucket: "guidenurse-46052.firebasestorage.app",
      messagingSenderId: "702106825259",
      appId: "1:702106825259:web:f108a2ff9846e00febf06e",
      measurementId: "G-ECJ7G0MMQY"
    };

    // Global application database and status tracking variables
    const appId = "guidenurse-46052";
    let app, auth, db;
    let firebaseActive = false;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseActive = true;
    } catch (error) {
      console.error("Critical: Database linking fault.", error);
    }

    // Interactive State Variables
    const state = {
      user: null,
      passcode: localStorage.getItem('rn_passcode') || '',
      isLocked: true,
      passcodeInput: '',
      passcodeError: '',
      setupStep: localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1',
      tempPasscode: '',
      activeTab: 'search',
      selectedDrug: null,
      clinicalDrugs: JSON.parse(localStorage.getItem('rn_local_drugs') || '[]'),
      searchQuery: '',
      apiLoading: false,
      apiError: null,
      calcType: 'drip',
      calcInput: {
        volume: '',
        time: '',
        dropFactor: '15',
        doseOrdered: '',
        weight: '',
        concentrationVal: '',
        concentrationVol: '',
        timeUnit: 'min'
      },
      calcResult: null,
      assistantPrompt: '',
      assistantResponse: '',
      assistantLoading: false,
      authEmail: '',
      authPassword: '',
      isSignUp: false,
      authLoading: false,
      authError: ''
    };

    // Custom Banner Toast Alert
    function showBanner(message, type = 'success') {
      const banner = document.getElementById('system-notification');
      const text = document.getElementById('notif-text');
      if (!banner || !text) return;

      text.textContent = message;
      banner.className = `p-2.5 text-[11px] font-bold tracking-wide text-center absolute top-[44px] left-0 right-0 z-50 shadow-md flex items-center justify-center space-x-1.5 transition-all duration-300 ${
        type === 'success' ? 'bg-teal-700 text-white' : 
        type === 'error' ? 'bg-red-800 text-white' : 'bg-slate-800 text-white'
      }`;
      banner.classList.remove('hidden');

      setTimeout(() => {
        banner.classList.add('hidden');
      }, 4500);
    }

    // Monitor Authentication State
    if (firebaseActive) {
      onAuthStateChanged(auth, (authUser) => {
        state.user = authUser;
        if (authUser) {
          state.isLocked = true;
          state.setupStep = localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1';
          syncFirestoreFormulary();
        } else {
          state.isLocked = true;
        }
        renderApp();
      });
    }

    // Real-time synchronization of shared monographs
    function syncFirestoreFormulary() {
      if (!firebaseActive || !state.user) return;
      const drugsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'drugs');
      
      onSnapshot(drugsCollection, 
        (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            list.push({ id: doc.id, ...doc.data() });
          });
          
          const localDrugs = JSON.parse(localStorage.getItem('rn_local_drugs') || '[]');
          const merged = [...list];
          localDrugs.forEach(localD => {
            if (!merged.find(m => m.genericName.toLowerCase() === localD.genericName.toLowerCase())) {
              merged.push(localD);
            }
          });
          state.clinicalDrugs = merged;
          localStorage.setItem('rn_local_drugs', JSON.stringify(merged));
          renderApp();
        },
        (error) => {
          console.error("Sync link offline:", error);
          showBanner("Clinical database synchronization offline.", "info");
        }
      );
    }

    // Exponential Backoff Fetch
    async function fetchWithRetry(url, options, maxRetries = 5) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return await response.json();
        } catch (err) {
          if (i === maxRetries - 1) throw err;
        }
        const delay = Math.pow(2, i) * 1000;
        await new Promise(resolve => setTimeout(resolve, delay));
      }
    }

    // API Query to Gemini for real-time monograph synthesis
    async function handleAIQuery(queryName) {
      if (!queryName.trim()) return;
      state.apiLoading = true;
      state.apiError = null;
      renderApp();

      const apiKey = ""; 
      const systemPrompt = `You are an authoritative clinical pharmacology expert. Design comprehensive medical monographs for Registered Nurses. Focus exclusively on active clinical practice parameters, patient safety protocols, IV infusion guidelines, rate restrictions, lab monitoring schedules, and therapeutic drug-drug interactions. Omit academic testing references, mnemonic shortcuts, or generic study tips. Format output exactly in standard scientific schema JSON.`;
      const userPrompt = `Synthesize clinical monograph and critical safety criteria for: "${queryName}". Access recent medical advisories and consensus literature.`;

      const responseSchema = {
        type: "OBJECT",
        properties: {
          genericName: { type: "STRING" },
          brandNames: { type: "ARRAY", items: { type: "STRING" } },
          therapeuticClass: { type: "STRING" },
          indications: { type: "ARRAY", items: { type: "STRING" } },
          highAlert: { type: "BOOLEAN" },
          blackBoxWarning: { type: "STRING" },
          mechanismOfAction: { type: "STRING" },
          administration: {
            type: "OBJECT",
            properties: {
              routes: { type: "ARRAY", items: { type: "STRING" } },
              ivCompatibility: { type: "STRING" },
              infusionRate: { type: "STRING" },
              criticalActions: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["routes", "ivCompatibility", "infusionRate", "criticalActions"]
          },
          monitoring: {
            type: "OBJECT",
            properties: {
              vitalSigns: { type: "ARRAY", items: { type: "STRING" } },
              labValues: { type: "ARRAY", items: { type: "STRING" } },
              clinicalSigns: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["vitalSigns", "labValues", "clinicalSigns"]
          },
          interactions: { type: "ARRAY", items: { type: "STRING" } },
          contraindications: { type: "ARRAY", items: { type: "STRING" } },
          patientEducation: { type: "ARRAY", items: { type: "STRING" } },
          recentResearch: { type: "STRING" }
        },
        required: [
          "genericName", "brandNames", "therapeuticClass", "indications", "highAlert",
          "blackBoxWarning", "mechanismOfAction", "administration", "monitoring",
          "interactions", "contraindications", "patientEducation", "recentResearch"
        ]
      };

      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        tools: [{ google_search: {} }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: responseSchema,
          temperature: 0.1
        }
      };

      try {
        const resultData = await fetchWithRetry(
          `https://genergenerativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }
        );

        const parsedText = resultData.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!parsedText) throw new Error("Invalid response received.");

        const generatedDrug = JSON.parse(parsedText);
        const attributions = resultData.candidates?.[0]?.groundingMetadata?.groundingAttributions || [];
        const references = attributions.map(attr => ({
          title: attr.web?.title || "Clinical Advisory",
          uri: attr.web?.uri || ""
        })).filter(ref => ref.uri !== "");

        const drugWithMeta = {
          ...generatedDrug,
          id: generatedDrug.genericName.toLowerCase().replace(/\s+/g, '-'),
          createdAt: new Date().toISOString(),
          references: references.length > 0 ? references : [{ title: "Primary Monograph & Safety Protocols", uri: "" }]
        };

        if (firebaseActive && state.user) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'drugs', drugWithMeta.id);
          await setDoc(docRef, drugWithMeta);
        }

        const updatedLocal = [drugWithMeta, ...state.clinicalDrugs.filter(d => d.id !== drugWithMeta.id)];
        localStorage.setItem('rn_local_drugs', JSON.stringify(updatedLocal));
        state.clinicalDrugs = updatedLocal;
        state.selectedDrug = drugWithMeta;
        state.searchQuery = '';
        showBanner(`${drugWithMeta.genericName.toUpperCase()} monograph created.`, "success");
      } catch (err) {
        console.error(err);
        state.apiError = "Database error. Verify generic molecular spelling or connection status.";
      } finally {
        state.apiLoading = false;
        renderApp();
      }
    }

    // AI Scenario Assistant Search Handler
    async function handleAssistantQuery() {
      if (!state.assistantPrompt.trim()) return;
      state.assistantLoading = true;
      state.assistantResponse = '';
      renderApp();

      const apiKey = "";
      const systemPrompt = `You are an expert Clinical Pharmacologist and Nursing Educator. Analyze the scenario using standard clinical, evidence-based guidelines. Respond in a brief, sterile, and professional clinical layout. Avoid informal or casual terminology, and focus entirely on quantitative safe parameters and immediate clinical workflows.`;

      const payload = {
        contents: [{ parts: [{ text: state.assistantPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        tools: [{ google_search: {} }]
      };

      try {
        const response = await fetch(
          `https://genergenerativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }
        );
        const data = await response.json();
        state.assistantResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "No analysis generated.";
      } catch (e) {
        state.assistantResponse = "Link failure. Unable to complete analysis.";
      } finally {
        state.assistantLoading = false;
        renderApp();
      }
    }

    // Render engine to output views based on unified application state
    function renderApp() {
      const container = document.getElementById('app-viewport');
      const bottomNav = document.getElementById('bottom-navigation');
      
      if (!container) return;

      // Gate 1: Firebase Auth Gate
      if (!state.user) {
        bottomNav.classList.add('hidden');
        container.innerHTML = `
          <div class="absolute inset-0 bg-slate-950 flex flex-col justify-between p-8 z-40 overflow-y-auto text-white">
            <div class="text-center mt-12">
              <h1 class="text-lg font-bold tracking-widest text-slate-200 uppercase">Clinical Access Portal</h1>
              <p class="text-teal-400 text-[10px] tracking-widest font-bold uppercase mt-1">Identity Authentication Required</p>
            </div>

            <form id="auth-form" class="space-y-4 my-auto">
              <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Institutional Email</label>
                <input
                  type="email"
                  id="auth-email-input"
                  required
                  placeholder="credential@hospital.org"
                  value="${state.authEmail}"
                  class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-teal-500 transition-colors"
                />
              </div>

              <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Security Password</label>
                <input
                  type="password"
                  id="auth-password-input"
                  required
                  placeholder="••••••••"
                  value="${state.authPassword}"
                  class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-teal-500 transition-colors"
                />
              </div>

              ${state.authError ? `
                <div class="p-3 bg-red-950/20 border border-red-900/40 text-red-400 text-xs rounded-lg flex items-start space-x-2">
                  <svg class="w-4 h-4 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  <p>${state.authError}</p>
                </div>
              ` : ''}

              <button
                type="submit"
                id="auth-submit-btn"
                class="w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold py-3 rounded-lg text-xs uppercase tracking-wider transition-all active:scale-98 shadow-sm"
              >
                ${state.authLoading ? "Verifying..." : state.isSignUp ? "Establish Account" : "Access Database"}
              </button>

              <div class="text-center">
                <button
                  type="button"
                  id="auth-mode-toggle"
                  class="text-xs text-teal-400 hover:text-teal-300 transition-colors"
                >
                  ${state.isSignUp ? "Account Active? Sign In" : "Register Institutional Account"}
                </button>
              </div>
            </form>

            <div class="text-center text-[9px] text-slate-500 tracking-wider pb-4">
              SECURE LOGISTICS SECURITY MODULE — DATA PROTECTED UNDER HIPAA
            </div>
          </div>
        `;

        // Event Listeners for Auth Gate
        document.getElementById('auth-email-input').addEventListener('input', (e) => { state.authEmail = e.target.value; });
        document.getElementById('auth-password-input').addEventListener('input', (e) => { state.authPassword = e.target.value; });
        document.getElementById('auth-mode-toggle').addEventListener('click', () => {
          state.isSignUp = !state.isSignUp;
          state.authError = '';
          renderApp();
        });
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          state.authLoading = true;
          state.authError = '';
          renderApp();
          try {
            if (state.isSignUp) {
              await createUserWithEmailAndPassword(auth, state.authEmail, state.authPassword);
              showBanner("Account established. Setup PIN.", "success");
            } else {
              await signInWithEmailAndPassword(auth, state.authEmail, state.authPassword);
              showBanner("Authenticated. Device unlocked.", "success");
            }
          } catch (err) {
            console.error(err);
            state.authError = err.message.replace("Firebase:", "");
          } finally {
            state.authLoading = false;
            renderApp();
          }
        });
        return;
      }

      // Gate 2: Passcode Lock Screen (Requires verified setup or entry)
      if (state.isLocked) {
        bottomNav.classList.add('hidden');
        container.innerHTML = `
          <div class="absolute inset-0 bg-slate-950 flex flex-col justify-between p-8 z-40 text-white">
            <div class="text-center mt-12">
              <h1 class="text-lg font-bold tracking-wider text-slate-200 uppercase">Device Security PIN</h1>
              <p class="text-slate-400 text-[10px] tracking-widest uppercase font-bold mt-1">Terminal Lock Enabled</p>
              <p class="text-slate-600 text-[10px] mt-1.5 truncate">Operator: ${state.user.email}</p>
            </div>

            <div class="my-auto text-center">
              <div class="text-xs text-slate-400 mb-3 uppercase tracking-wider">
                ${state.setupStep === 'setup-1' ? 'Configure Secure Passcode' : ''}
                ${state.setupStep === 'setup-2' ? 'Verify Secure Passcode' : ''}
                ${state.setupStep === 'enter' ? 'Enter Authorized Passcode' : ''}
              </div>

              <!-- Indicators -->
              <div class="flex justify-center space-x-4 mb-4">
                ${[0, 1, 2, 3].map(idx => `
                  <div class="w-3 h-3 rounded-full border border-slate-600 transition-all duration-150 ${
                    state.passcodeInput.length > idx ? 'bg-teal-500 border-teal-500 scale-110 shadow-sm shadow-teal-500/20' : 'bg-transparent'
                  }"></div>
                `).join('')}
              </div>

              ${state.passcodeError ? `
                <div class="text-red-400 text-xs mt-1 bg-red-950/20 py-1 px-3 rounded-full inline-block border border-red-900/30">
                  ${state.passcodeError}
                </div>
              ` : ''}
            </div>

            <!-- PIN Pad UI Component -->
            <div class="mb-4">
              <div class="grid grid-cols-3 gap-4 max-w-xs mx-auto">
                ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
                  <button onclick="window.pressPIN('${num}')" class="w-14 h-14 rounded-full bg-slate-900 border border-slate-800 hover:bg-slate-850 active:scale-95 transition-all flex items-center justify-center text-lg font-bold text-slate-200 mx-auto">
                    ${num}
                  </button>
                `).join('')}
                <div class="w-14 h-14 flex items-center justify-center">
                  <button onclick="window.signoutUser()" class="text-[10px] text-red-400 font-bold tracking-wider uppercase">Exit</button>
                </div>
                <button onclick="window.pressPIN('0')" class="w-14 h-14 rounded-full bg-slate-900 border border-slate-800 hover:bg-slate-850 active:scale-95 transition-all flex items-center justify-center text-lg font-bold text-slate-200 mx-auto">
                  0
                </button>
                <button onclick="window.pressPIN('delete')" class="w-14 h-14 rounded-full bg-slate-900 hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center text-[10px] font-bold text-slate-400 mx-auto uppercase">
                  DEL
                </button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Main UI Frame (Unlocked State)
      bottomNav.classList.remove('hidden');

      // Tab selection navigation styling helper

              <div class="space-y-4 animate-fade-in">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block">Administration Speed Reference</span>
                  <div class="grid grid-cols-2 gap-2">
                    <div class="p-2.5 bg-white rounded border border-slate-100">
                      <span class="text-[7px] uppercase font-bold text-slate-400 block">Infusion Rate</span>
                      <span class="text-[11px] font-semibold text-slate-800 leading-relaxed block mt-0.5">${drug.administration.infusionRate}</span>
                    </div>
                    <div class="p-2.5 bg-white rounded border border-slate-100">
                      <span class="text-[7px] uppercase font-bold text-slate-400 block">Molecular Classification</span>
                      <span class="text-[11px] font-semibold text-slate-800 leading-relaxed block mt-0.5">${drug.therapeuticClass}</span>
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-100 pt-3">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Target Monitoring Parameters</span>
                  <div class="space-y-1.5 bg-teal-50/20 p-3 rounded border border-teal-100/50">
                    <div class="text-[11px] text-slate-800 font-semibold flex items-start space-x-1.5">
                      <span class="text-teal-600 mt-1 flex-shrink-0">•</span>
                      <span><strong>Vitals Assessment:</strong> ${drug.monitoring.vitalSigns[0] || 'Standard baseline checks.'}</span>
                    </div>
                    <div class="text-[11px] text-slate-800 font-semibold flex items-start space-x-1.5">
                      <span class="text-teal-600 mt-1 flex-shrink-0">•</span>
                      <span><strong>Chemical Pathology Assay:</strong> ${drug.monitoring.labValues[0] || 'Standard metabolic panels.'}</span>
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-100 pt-3">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Immediate Delivery Actions</span>
                  <div class="bg-slate-950 text-teal-400 p-3.5 rounded-lg text-xs space-y-1.5 font-mono shadow-inner border border-slate-800">
                    <div class="flex items-start space-x-2">
                      <span class="text-teal-500">•</span>
                      <span>${drug.administration.criticalActions[0] || 'Perform secondary independent verification.'}</span>
                    </div>
                    ${drug.administration.criticalActions[1] ? `
                      <div class="flex items-start space-x-2 pt-1.5 border-t border-slate-900">
                        <span class="text-teal-500">•</span>
                        <span>${drug.administration.criticalActions[1]}</span>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
            ` : ''}

            <!-- Admin and IV Compatibility Tab -->
            ${window.drugTabState === 'admin' ? `
              <div class="space-y-3 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Standard Administration Routes</span>
                  <div class="flex flex-wrap gap-1">
                    ${drug.administration.routes.map(route => `
                      <span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">${route}</span>
                    `).join('')}
                  </div>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">IV Compatibility, Dilution, & Lines</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed bg-teal-50/50 p-2.5 rounded border border-teal-100/50">${drug.administration.ivCompatibility}</p>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Infusion Duration / Rate Restrictions</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed">${drug.administration.infusionRate}</p>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Mandatory Preparation Directives</span>
                  <ul class="space-y-1.5">
                    ${drug.administration.criticalActions.map(action => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${action}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            <!-- Kinetics & Action tab -->
            ${window.drugTabState === 'info' ? `
              <div class="space-y-3 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Indications</span>
                  <ul class="space-y-1">
                    ${drug.indications.map(ind => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${ind}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Pharmacological Mechanism of Action</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed">${drug.mechanismOfAction}</p>
                </div>
              </div>
            ` : ''}

            <!-- Monitoring tab -->
            ${window.drugTabState === 'monitoring' ? `
              <div class="space-y-3 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Hemodynamic Assessment Parameters</span>
                  <ul class="space-y-1.5">
                    ${drug.monitoring.vitalSigns.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Clinical Pathology Assays</span>
                  <ul class="space-y-1.5">
                    ${drug.monitoring.labValues.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Systemic Toxicities</span>
                  <ul class="space-y-1.5">
                    ${drug.monitoring.clinicalSigns.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            <!-- Interactions & Contraindications tab -->
            ${window.drugTabState === 'interactions' ? `
              <div class="space-y-3 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-red-500 uppercase tracking-wider block mb-1">Therapeutic Incompatibilities</span>
                  <ul class="space-y-1.5">
                    ${drug.interactions.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-red-500 uppercase tracking-wider block mb-1">Absolute & Relative Contraindications</span>
                  <ul class="space-y-1.5">
                    ${drug.contraindications.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            <!-- Research summary & patient teaching tab -->
            ${window.drugTabState === 'research' ? `
              <div class="space-y-3 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Clinical Literature Guidelines</span>
                  <p class="text-xs text-slate-800 leading-relaxed font-medium bg-slate-50 p-2.5 rounded border border-slate-200">${drug.recentResearch}</p>
                </div>

                <div class="border-t border-slate-100 pt-2.5">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Primary Patient Safety Criteria</span>
                  <ul class="space-y-1.5">
                    ${drug.patientEducation.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                ${drug.references && drug.references.length > 0 ? `
                  <div class="border-t border-slate-100 pt-2.5">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Source Attributions</span>
                    <div class="space-y-1">
                      ${drug.references.map(ref => `
                        <div class="text-[10px] text-teal-600 font-semibold truncate">
                          ${ref.uri ? `
                            <a href="${ref.uri}" target="_blank" rel="noopener noreferrer" class="underline hover:text-teal-800 flex items-center space-x-1">
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 002.502-2.502m1.07-1.912a4 4 0 015.656 0l4 4a4 4 0 01-5.656 5.656l-1.1 1.1" /></svg>
                              <span>${ref.title}</span>
                            </a>
                          ` : `
                            <div class="flex items-center space-x-1 text-slate-500 font-normal">
                              <span>${ref.title}</span>
                            </div>
                          `}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : ''}

          </div>
        </div>
      `;
    }

    // Window global functions bound for simple HTML trigger bindings
    window.switchTab = (tabId) => {
      state.activeTab = tabId;
      state.selectedDrug = null;
      renderApp();
    };

    window.selectDrug = (drugId) => {
      state.selectedDrug = state.clinicalDrugs.find(d => d.id === drugId);
      window.drugTabState = 'summary';
      renderApp();
    };

    window.closeDrugDetail = () => {
      state.selectedDrug = null;
      renderApp();
    };

    window.setDrugDetailTab = (tabId) => {
      window.drugTabState = tabId;
      renderApp();
    };

    window.setCalcType = (calcId) => {
      state.calcType = calcId;
      state.calcResult = null;
      renderApp();
    };

    // Calculate dosage/rates math
    window.runCalculation = () => {
      if (state.calcType === 'drip') {
        const vol = parseFloat(state.calcInput.volume);
        const hrs = parseFloat(state.calcInput.time);
        const df = parseFloat(state.calcInput.dropFactor);

        if (isNaN(vol) || isNaN(hrs) || isNaN(df) || vol <= 0 || hrs <= 0) {
          state.calcResult = { error: "Input criteria mismatch. All parameters must be positive integers." };
          renderApp();
          return;
        }

        const mlPerHour = Math.round((vol / hrs) * 10) / 10;
        const gttsPerMin = Math.round((vol * df) / (hrs * 60));
        state.calcResult = {
          type: 'drip',
          mlPerHour,
          gttsPerMin,
          summary: `Administer continuous infusion at ${mlPerHour} mL/hr (equivalent to ${gttsPerMin} drops/minute at a set factor of ${df} drops/mL).`
        };
      } else {
        const dose = parseFloat(state.calcInput.doseOrdered);
        const wt = parseFloat(state.calcInput.weight);
        const concV = parseFloat(state.calcInput.concentrationVal);
        const concVol = parseFloat(state.calcInput.concentrationVol);

        if (isNaN(dose) || isNaN(concV) || isNaN(concVol) || dose <= 0 || concV <= 0 || concVol <= 0) {
          state.calcResult = { error: "Input criteria mismatch. Concentration parameters must be positive integers." };
          renderApp();
          return;
        }

        let hourlyDose = dose;
        if (state.calcInput.timeUnit === 'min') {
          hourlyDose = dose * 60;
        }

        if (wt && wt > 0) {
          hourlyDose = hourlyDose * wt;
        }

        const mlPerHour = Math.round(((hourlyDose / concV) * concVol) * 100) / 100;
        
        state.calcResult = {
          type: 'dose',
          mlPerHour,
          summary: `Deliver continuous infusion at ${mlPerHour} mL/hr to target a prescribed dosage of ${dose} ${wt ? 'mcg/kg/min' : 'mg/hr'}.`
        };
      }
      renderApp();
    };

    window.runAssistantQuery = () => {
      handleAssistantQuery();
    };

    // PIN Pad Handler
    window.pressPIN = (key) => {
      state.passcodeError = '';
      if (key === 'delete') {
        state.passcodeInput = state.passcodeInput.slice(0, -1);
        renderApp();
        return;
      }

      if (state.passcodeInput.length >= 4) return;
      state.passcodeInput += key;
      renderApp();

      if (state.passcodeInput.length === 4) {
        if (state.setupStep === 'setup-1') {
          state.tempPasscode = state.passcodeInput;
          state.setupStep = 'setup-2';
          state.passcodeInput = '';
          showBanner("Confirm passcode pattern", "info");
        } else if (state.setupStep === 'setup-2') {
          if (state.passcodeInput === state.tempPasscode) {
            localStorage.setItem('rn_passcode', state.passcodeInput);
            state.passcode = state.passcodeInput;
            state.setupStep = 'enter';
            state.isLocked = false;
            state.passcodeInput = '';
            showBanner("Terminal access authorized.", "success");
          } else {
            state.passcodeError = "Verification mismatch. Restart configuration.";
            state.setupStep = 'setup-1';
            state.passcodeInput = '';
            state.tempPasscode = '';
          }
        } else if (state.setupStep === 'enter') {
          if (state.passcodeInput === state.passcode) {
            state.isLocked = false;
            state.passcodeInput = '';
            showBanner("Terminal unlocked.", "success");
          } else {
            state.passcodeError = "Access code invalid.";
            state.passcodeInput = '';
          }
        }
        renderApp();
      }
    };

    // Exit & PIN management
    window.signoutUser = async () => {
      try {
        await signOut(auth);
        state.user = null;
        state.isLocked = true;
        state.passcodeInput = '';
        renderApp();
        showBanner("Session terminated.", "info");
      } catch (err) {
        console.error("Logout failed", err);
      }
    };

    window.clearPasscode = () => {
      localStorage.removeItem('rn_passcode');
      state.passcode = '';
      state.setupStep = 'setup-1';
      state.passcodeInput = '';
      state.isLocked = true;
      renderApp();
      showBanner("Local security configuration cleared.", "info");
    };

    // Initial load
    const filteredDrugs = state.clinicalDrugs;
    renderApp();
  </script>
</body>
</html>
