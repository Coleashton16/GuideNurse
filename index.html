<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GuideNurse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    .mono-font {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Native App Scroll Container Physics */
    .app-scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Hide scrollbars on navigation bars */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Tap target micro-feedback */
    .active-feedback:active {
      background-color: rgba(204, 251, 241, 0.4);
    }
    .btn-feedback:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#0a0d16',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-800 antialiased h-[100dvh] w-full flex justify-center items-center overflow-hidden md:p-4">

  <div class="w-full h-full max-w-md bg-slate-50 flex flex-col relative shadow-2xl md:border md:border-slate-800 md:rounded-[2rem] overflow-hidden">
    
    <div id="system-notification" class="hidden p-3 text-xs font-semibold text-center absolute top-0 left-0 right-0 z-50 shadow-md transition-all duration-300 flex items-center justify-center space-x-2">
      <span id="notif-text">System Status Update</span>
    </div>

    <div id="app-viewport" class="flex flex-col h-full flex-grow overflow-hidden">
      </div>

    <nav id="bottom-navigation" class="hidden flex-shrink-0 bg-slate-950 text-white flex justify-around py-2 px-1 border-t border-slate-900 shadow-xl z-30 pb-safe">
      <button onclick="window.switchTab('search')" id="nav-search" class="flex flex-col items-center flex-1 py-1.5 text-teal-400 font-bold transition-all focus:outline-none">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Inquiry</span>
      </button>
      <button onclick="window.switchTab('formulary')" id="nav-formulary" class="flex flex-col items-center flex-1 py-1.5 text-slate-500 hover:text-slate-300 transition-all focus:outline-none">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Index</span>
      </button>
      <button onclick="window.switchTab('tools')" id="nav-tools" class="flex flex-col items-center flex-1 py-1.5 text-slate-500 hover:text-slate-300 transition-all focus:outline-none">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Calculations</span>
      </button>
      <button onclick="window.switchTab('settings')" id="nav-settings" class="flex flex-col items-center flex-1 py-1.5 text-slate-500 hover:text-slate-300 transition-all focus:outline-none">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        <span class="text-[9px] tracking-wider uppercase font-semibold">Settings</span>
      </button>
    </nav>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Your confirmed web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBHAPAy9Z4kQrWod7Pa0MMrrpppeMpiqZA",
      authDomain: "guidenurse-46052.firebaseapp.com",
      databaseURL: "https://guidenurse-46052-default-rtdb.firebaseio.com",
      projectId: "guidenurse-46052",
      storageBucket: "guidenurse-46052.firebasestorage.app",
      messagingSenderId: "702106825259",
      appId: "1:702106825259:web:f108a2ff9846e00febf06e",
      measurementId: "G-ECJ7G0MMQY"
    };

    const appId = "guidenurse-46052";
    let app, auth, db;
    let firebaseActive = false;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseActive = true;
    } catch (error) {
      console.error("Critical: Database linking fault.", error);
    }

    // Unified Reactive Application State
    const state = {
      user: null,
      passcode: localStorage.getItem('rn_passcode') || '',
      isLocked: true,
      passcodeInput: '',
      passcodeError: '',
      setupStep: localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1',
      tempPasscode: '',
      activeTab: 'search',
      selectedDrug: null,
      clinicalDrugs: JSON.parse(localStorage.getItem('rn_local_drugs') || '[]'),
      searchQuery: '',
      apiLoading: false,
      apiError: null,
      calcType: 'drip',
      calcInput: {
        volume: '',
        time: '',
        dropFactor: '15',
        doseOrdered: '',
        weight: '',
        concentrationVal: '',
        concentrationVol: '',
        timeUnit: 'min'
      },
      calcResult: null,
      assistantPrompt: '',
      assistantResponse: '',
      assistantLoading: false,
      authEmail: '',
      authPassword: '',
      isSignUp: false,
      authLoading: false,
      authError: ''
    };

    // System Notification Manager
    function showBanner(message, type = 'success') {
      const banner = document.getElementById('system-notification');
      const text = document.getElementById('notif-text');
      if (!banner || !text) return;

      text.textContent = message;
      banner.className = `p-3 text-[11px] font-bold tracking-wide text-center absolute top-0 left-0 right-0 z-50 shadow-md flex items-center justify-center space-x-1.5 transition-all duration-300 ${
        type === 'success' ? 'bg-teal-700 text-white' : 
        type === 'error' ? 'bg-red-800 text-white' : 'bg-slate-800 text-white'
      }`;
      banner.classList.remove('hidden');

      setTimeout(() => {
        banner.classList.add('hidden');
      }, 4500);
    }

    // Global Event Listener for Session Authentication
    if (firebaseActive) {
      onAuthStateChanged(auth, (authUser) => {
        state.user = authUser;
        if (authUser) {
          state.isLocked = true;
          state.setupStep = localStorage.getItem('rn_passcode') ? 'enter' : 'setup-1';
          syncFirestoreFormulary();
        } else {
          state.isLocked = true;
        }
        renderApp();
      });
    }

    // Firestore Integration & Data Synchronization
    function syncFirestoreFormulary() {
      if (!firebaseActive || !state.user) return;
      const drugsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'drugs');
      
      onSnapshot(drugsCollection, 
        (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            list.push({ id: doc.id, ...doc.data() });
          });
          
          const localDrugs = JSON.parse(localStorage.getItem('rn_local_drugs') || '[]');
          const merged = [...list];
          localDrugs.forEach(localD => {
            if (!merged.find(m => m.genericName.toLowerCase() === localD.genericName.toLowerCase())) {
              merged.push(localD);
            }
          });
          state.clinicalDrugs = merged;
          localStorage.setItem('rn_local_drugs', JSON.stringify(merged));
          renderApp();
        },
        (error) => {
          console.error("Firestore sync subscription failure:", error);
          showBanner("Cloud sync failed. Check Firestore rules.", "error");
        }
      );
    }

    // Robust Exponential Backoff API Wrapper (Catches Non-200 responses)
    async function fetchWithRetry(url, options, maxRetries = 5) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errText}`);
          }
          return await response.json();
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          const delay = Math.pow(2, i) * 1000;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    // Real-Time Evidence-Based Monograph Generation via Gemini 2.5 Flash
    async function handleAIQuery(queryName) {
      if (!queryName.trim()) return;
      state.apiLoading = true;
      state.apiError = null;
      renderApp();

      // Ensure key injection functions exactly as designed in this environment
      const apiKey = "AQ.Ab8RN6LzTWyaao4RKAOHJvAPQsygVF_WQ9ThvVIleJ-9nHywmQ"; 
      const systemPrompt = `You are an authoritative clinical pharmacology expert. Design comprehensive medical monographs for Registered Nurses. Focus exclusively on active clinical practice parameters, patient safety protocols, IV infusion guidelines, rate restrictions, lab monitoring schedules, and therapeutic drug-drug interactions. Omit academic testing references, mnemonic shortcuts, or generic study tips. Format output exactly in standard scientific schema JSON.`;
      const userPrompt = `Synthesize clinical monograph and critical safety criteria for: "${queryName}". Access recent medical advisories and consensus literature.`;

      const responseSchema = {
        type: "OBJECT",
        properties: {
          genericName: { type: "STRING" },
          brandNames: { type: "ARRAY", items: { type: "STRING" } },
          therapeuticClass: { type: "STRING" },
          indications: { type: "ARRAY", items: { type: "STRING" } },
          highAlert: { type: "BOOLEAN" },
          blackBoxWarning: { type: "STRING" },
          mechanismOfAction: { type: "STRING" },
          administration: {
            type: "OBJECT",
            properties: {
              routes: { type: "ARRAY", items: { type: "STRING" } },
              ivCompatibility: { type: "STRING" },
              infusionRate: { type: "STRING" },
              criticalActions: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["routes", "ivCompatibility", "infusionRate", "criticalActions"]
          },
          monitoring: {
            type: "OBJECT",
            properties: {
              vitalSigns: { type: "ARRAY", items: { type: "STRING" } },
              labValues: { type: "ARRAY", items: { type: "STRING" } },
              clinicalSigns: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["vitalSigns", "labValues", "clinicalSigns"]
          },
          interactions: { type: "ARRAY", items: { type: "STRING" } },
          contraindications: { type: "ARRAY", items: { type: "STRING" } },
          patientEducation: { type: "ARRAY", items: { type: "STRING" } },
          recentResearch: { type: "STRING" }
        },
        required: [
          "genericName", "brandNames", "therapeuticClass", "indications", "highAlert",
          "blackBoxWarning", "mechanismOfAction", "administration", "monitoring",
          "interactions", "contraindications", "patientEducation", "recentResearch"
        ]
      };

      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: responseSchema,
          temperature: 0.1
        }
      };

      try {
        const resultData = await fetchWithRetry(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }
        );

        const parsedText = resultData.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!parsedText) throw new Error("Null response from core AI processing pipeline.");

        const generatedDrug = JSON.parse(parsedText);
        const drugWithMeta = {
          ...generatedDrug,
          id: generatedDrug.genericName.toLowerCase().replace(/\s+/g, '-'),
          createdAt: new Date().toISOString(),
          references: [{ title: "Primary Monograph & Safety Protocols", uri: "" }]
        };

        // Saving to live Firestore 
        if (firebaseActive && state.user) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'drugs', drugWithMeta.id);
            await setDoc(docRef, drugWithMeta);
          } catch (fsErr) {
            console.error("Cloud Sync Warning - Make sure Firestore Rules allow write access:", fsErr);
            showBanner("Database Save Blocked: Check Firestore Rules", "error");
          }
        }

        const updatedLocal = [drugWithMeta, ...state.clinicalDrugs.filter(d => d.id !== drugWithMeta.id)];
        localStorage.setItem('rn_local_drugs', JSON.stringify(updatedLocal));
        state.clinicalDrugs = updatedLocal;
        state.selectedDrug = drugWithMeta;
        state.searchQuery = '';
        showBanner(`${drugWithMeta.genericName.toUpperCase()} synthesized successfully.`, "success");
      } catch (err) {
        console.error("Synthesis Exception:", err);
        state.apiError = "Inquiry failed. " + (err.message || "Confirm connection or query format.");
      } finally {
        state.apiLoading = false;
        renderApp();
      }
    }

    // AI Clinical Scenario Inquiry
    async function handleAssistantQuery() {
      if (!state.assistantPrompt.trim()) return;
      state.assistantLoading = true;
      state.assistantResponse = '';
      renderApp();

      const apiKey = "AQ.Ab8RN6LzTWyaao4RKAOHJvAPQsygVF_WQ9ThvVIleJ-9nHywmQ";
      const systemPrompt = `You are an expert Clinical Pharmacologist and Nursing Educator. Analyze the scenario using standard clinical, evidence-based guidelines. Respond in a brief, sterile, and professional clinical layout. Avoid informal or casual terminology, and focus entirely on quantitative safe parameters and immediate clinical workflows.`;

      const payload = {
        contents: [{ parts: [{ text: state.assistantPrompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        tools: [{ google_search: {} }]
      };

      try {
        const response = await fetchWithRetry(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }
        );
        state.assistantResponse = response.candidates?.[0]?.content?.parts?.[0]?.text || "Unable to synthesize clinical criteria.";
      } catch (e) {
        console.error("Assistant Exception:", e);
        state.assistantResponse = "Server pipeline unreachable. " + (e.message || "Review local link.");
      } finally {
        state.assistantLoading = false;
        renderApp();
      }
    }

    // Fluid Mobile Rendering Engine 
    function renderApp() {
      const container = document.getElementById('app-viewport');
      const bottomNav = document.getElementById('bottom-navigation');
      if (!container) return;

      // filtered dataset computed reactively
      const filteredDrugs = state.clinicalDrugs.filter(d => 
        d.genericName.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
        d.brandNames.some(b => b.toLowerCase().includes(state.searchQuery.toLowerCase())) ||
        d.therapeuticClass.toLowerCase().includes(state.searchQuery.toLowerCase())
      );

      // Gate 1: Firebase Professional Account Gate
      if (!state.user) {
        bottomNav.classList.add('hidden');
        container.innerHTML = `
          <div class="flex-grow flex flex-col justify-between p-6 bg-slate-950 text-white h-full overflow-y-auto">
            <div class="text-center mt-12 flex-shrink-0">
              <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-teal-500/20">
                <svg class="w-8 h-8 text-slate-950" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-white">GuideNurse</h1>
              <p class="text-slate-500 text-[10px] tracking-wider uppercase font-semibold mt-1">Secure Clinical Authentication</p>
            </div>

            <form id="auth-form" class="space-y-4 my-auto max-w-xs w-full mx-auto py-8">
              <div>
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Email Address</label>
                <input
                  type="email"
                  id="auth-email-input"
                  required
                  placeholder="name@hospital.org"
                  value="${state.authEmail}"
                  class="w-full bg-slate-900 border border-slate-800 rounded-lg py-2.5 px-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
                />
              </div>

              <div>
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Password</label>
                <input
                  type="password"
                  id="auth-password-input"
                  required
                  placeholder="••••••••"
                  value="${state.authPassword}"
                  class="w-full bg-slate-900 border border-slate-800 rounded-lg py-2.5 px-3 text-xs text-white placeholder-slate-600 focus:outline-none focus:ring-1 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
                />
              </div>

              ${state.authError ? `
                <div class="p-2.5 bg-red-950/20 border border-red-900/30 text-red-400 text-[10px] rounded-lg flex items-start space-x-2">
                  <svg class="w-3.5 h-3.5 text-red-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  <p class="leading-normal">${state.authError}</p>
                </div>
              ` : ''}

              <button
                type="submit"
                id="auth-submit-btn"
                class="btn-feedback w-full bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs uppercase tracking-widest transition-all"
              >
                ${state.authLoading ? "Authenticating..." : state.isSignUp ? "Create Account" : "Log In"}
              </button>

              <div class="text-center pt-2">
                <button
                  type="button"
                  id="auth-mode-toggle"
                  class="text-[10px] text-slate-400 hover:text-teal-400 uppercase tracking-wider font-semibold transition-colors"
                >
                  ${state.isSignUp ? "Already have an account? Sign In" : "Need an account? Register"}
                </button>
              </div>
            </form>

            <div class="text-center flex-shrink-0 text-[8px] text-slate-600 tracking-widest pb-4">
              SECURED LOGISTICS COMPLIANCE HUB — PRIVACY SHIELD ENFORCED
            </div>
          </div>
        `;

        // Interactive Event Bindings
        document.getElementById('auth-email-input').value = state.authEmail;
        document.getElementById('auth-password-input').value = state.authPassword;
        document.getElementById('auth-email-input').addEventListener('input', (e) => { state.authEmail = e.target.value; });
        document.getElementById('auth-password-input').addEventListener('input', (e) => { state.authPassword = e.target.value; });
        document.getElementById('auth-mode-toggle').addEventListener('click', () => {
          state.isSignUp = !state.isSignUp;
          state.authError = '';
          renderApp();
        });
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          state.authLoading = true;
          state.authError = '';
          renderApp();
          try {
            if (state.isSignUp) {
              await createUserWithEmailAndPassword(auth, state.authEmail, state.authPassword);
              showBanner("Account active. Configure hardware lock PIN.", "success");
            } else {
              await signInWithEmailAndPassword(auth, state.authEmail, state.authPassword);
              showBanner("Access verified.", "success");
            }
          } catch (err) {
            console.error(err);
            state.authError = err.message.replace("Firebase:", "").trim();
          } finally {
            state.authLoading = false;
            renderApp();
          }
        });
        return;
      }

      // Gate 2: Passcode PIN Screen (Only available after successful Auth verification)
      if (state.isLocked) {
        bottomNav.classList.add('hidden');
        container.innerHTML = `
          <div class="flex-grow flex flex-col justify-between p-6 bg-slate-950 text-white h-full overflow-y-auto">
            <div class="text-center mt-10 flex-shrink-0">
              <div class="w-10 h-10 bg-teal-500/10 rounded-full flex items-center justify-center mx-auto mb-2.5 border border-teal-500/20">
                <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </div>
              <h2 class="text-xs font-bold tracking-widest text-slate-300 uppercase">Device Security Lock</h2>
              <p class="text-[9px] text-slate-500 uppercase mt-1 tracking-wider">${state.user.email}</p>
            </div>

            <div class="text-center my-auto py-8">
              <span class="text-[10px] text-slate-400 uppercase tracking-widest block mb-4 font-semibold">

      }
    }

    // Dynamic Monograph Drawer Detail Rendering
    function renderDrugDetail(drug, parentContainer) {
      if (!window.drugTabState) {
        window.drugTabState = 'summary'; 
      }

      parentContainer.innerHTML = `
        <div class="flex-grow flex flex-col h-full overflow-hidden bg-slate-50">
          
          <div class="p-5 bg-slate-950 text-white flex justify-between items-start flex-shrink-0 border-b border-slate-900">
            <div>
              <div class="flex items-center space-x-2">
                <h2 class="text-sm font-bold capitalize tracking-wide text-slate-100">${drug.genericName}</h2>
                ${drug.highAlert ? `
                  <span class="text-[7px] bg-red-950/40 text-red-400 border border-red-900/60 px-2 py-0.5 rounded font-black tracking-widest uppercase">
                    High Alert
                  </span>
                ` : ''}
              </div>
              <p class="text-[10px] text-slate-400 mt-1 tracking-wide font-medium">${drug.brandNames.join(', ')}</p>
              <span class="inline-block bg-slate-900 text-teal-400 text-[9px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded mt-2 border border-slate-800">
                ${drug.therapeuticClass}
              </span>
            </div>
            <button onclick="window.closeDrugDetail()" class="text-slate-400 hover:text-white bg-slate-900 px-3 py-1.5 rounded-lg text-[10px] uppercase font-bold tracking-wider transition-colors border border-slate-800">
              Close
            </button>
          </div>

          <div class="flex-shrink-0 flex bg-slate-100 border-b border-slate-200 p-1 overflow-x-auto whitespace-nowrap scrollbar-none">
            ${[
              { id: 'summary', label: 'Summary' },
              { id: 'admin', label: 'Admin & IV' },
              { id: 'info', label: 'Kinetics' },
              { id: 'monitoring', label: 'Monitoring' },
              { id: 'interactions', label: 'Contraindications' },
              { id: 'research', label: 'Clinical Evidence' }
            ].map(tab => `
              <button onclick="window.setDrugDetailTab('${tab.id}')" class="px-4 py-2 text-[9px] uppercase font-bold tracking-wider rounded-lg transition-all ${
                window.drugTabState === tab.id ? 'bg-white text-slate-950 shadow-sm' : 'text-slate-500 hover:text-slate-950'
              }">
                ${tab.label}
              </button>
            `).join('')}
          </div>

          <div class="flex-grow app-scroll-container p-4 pb-6 space-y-4">
            
            ${drug.blackBoxWarning && drug.blackBoxWarning.toLowerCase() !== 'none' ? `
              <div class="bg-red-50 border border-red-200 p-3.5 rounded-xl flex items-start space-x-2.5">
                <svg class="w-5 h-5 text-red-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <div>
                  <h4 class="text-[8px] font-bold uppercase tracking-wider text-red-800">Boxed FDA Safety Advisory</h4>
                  <p class="text-xs text-red-950 mt-0.5 font-medium leading-relaxed">${drug.blackBoxWarning}</p>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'summary' ? `
              <div class="space-y-4 animate-fade-in">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block">Administration Speed Reference</span>
                  <div class="grid grid-cols-2 gap-2">
                    <div class="p-2.5 bg-white rounded border border-slate-200/50">
                      <span class="text-[7px] uppercase font-bold text-slate-400 block">Infusion Rate</span>
                      <span class="text-[11px] font-semibold text-slate-800 leading-relaxed block mt-0.5">${drug.administration.infusionRate}</span>
                    </div>
                    <div class="p-2.5 bg-white rounded border border-slate-200/50">
                      <span class="text-[7px] uppercase font-bold text-slate-400 block">Molecular Classification</span>
                      <span class="text-[11px] font-semibold text-slate-800 leading-relaxed block mt-0.5">${drug.therapeuticClass}</span>
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Target Monitoring Parameters</span>
                  <div class="space-y-2 bg-teal-50/20 p-3.5 rounded-xl border border-teal-100/50">
                    <div class="text-[11px] text-slate-800 font-semibold flex items-start space-x-1.5">
                      <span class="text-teal-600 mt-1 flex-shrink-0">•</span>
                      <span><strong>Vitals Assessment:</strong> ${drug.monitoring.vitalSigns[0] || 'Standard baseline checks.'}</span>
                    </div>
                    <div class="text-[11px] text-slate-800 font-semibold flex items-start space-x-1.5">
                      <span class="text-teal-600 mt-1 flex-shrink-0">•</span>
                      <span><strong>Chemical Pathology Assay:</strong> ${drug.monitoring.labValues[0] || 'Standard metabolic panels.'}</span>
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[8px] font-bold text-slate-400 uppercase tracking-widest block mb-1.5">Immediate Delivery Actions</span>
                  <div class="bg-slate-950 text-teal-400 p-3.5 rounded-lg text-xs space-y-1.5 font-mono shadow-inner border border-slate-800">
                    <div class="flex items-start space-x-2">
                      <span class="text-teal-500">•</span>
                      <span>${drug.administration.criticalActions[0] || 'Perform secondary independent verification.'}</span>
                    </div>
                    ${drug.administration.criticalActions[1] ? `
                      <div class="flex items-start space-x-2 pt-1.5 border-t border-slate-900">
                        <span class="text-teal-500">•</span>
                        <span>${drug.administration.criticalActions[1]}</span>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'admin' ? `
              <div class="space-y-3.5 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Standard Administration Routes</span>
                  <div class="flex flex-wrap gap-1.5">
                    ${drug.administration.routes.map(route => `
                      <span class="bg-white text-slate-800 text-[10px] font-bold px-2.5 py-1 rounded border border-slate-200">${route}</span>
                    `).join('')}
                  </div>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">IV Compatibility, Dilution, & Lines</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed bg-teal-50/30 p-3 rounded-lg border border-teal-100/50">${drug.administration.ivCompatibility}</p>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Infusion Duration / Rate Restrictions</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed">${drug.administration.infusionRate}</p>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Mandatory Preparation Directives</span>
                  <ul class="space-y-2">
                    ${drug.administration.criticalActions.map(action => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${action}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'info' ? `
              <div class="space-y-3.5 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Approved Therapeutic Indications</span>
                  <ul class="space-y-2">
                    ${drug.indications.map(ind => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${ind}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Pharmacological Mechanism of Action</span>
                  <p class="text-xs text-slate-800 font-medium leading-relaxed">${drug.mechanismOfAction}</p>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'monitoring' ? `
              <div class="space-y-3.5 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Hemodynamic Assessment Parameters</span>
                  <ul class="space-y-2">
                    ${drug.monitoring.vitalSigns.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Clinical Pathology Assays</span>
                  <ul class="space-y-2">
                    ${drug.monitoring.labValues.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Systemic Toxicities / Adverse Signs</span>
                  <ul class="space-y-2">
                    ${drug.monitoring.clinicalSigns.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'interactions' ? `
              <div class="space-y-3.5 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-red-600 uppercase tracking-wider block mb-1.5">Therapeutic Incompatibilities</span>
                  <ul class="space-y-2">
                    ${drug.interactions.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-red-600 uppercase tracking-wider block mb-1.5">Absolute & Relative Contraindications</span>
                  <ul class="space-y-2">
                    ${drug.contraindications.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="text-red-500 font-bold">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${window.drugTabState === 'research' ? `
              <div class="space-y-3.5 animate-fade-in">
                <div>
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Consensus literature Guidelines</span>
                  <p class="text-xs text-slate-800 leading-relaxed font-medium bg-slate-100 p-3 rounded-lg border border-slate-250">${drug.recentResearch}</p>
                </div>

                <div class="border-t border-slate-200 pt-3">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Primary Patient Safety Criteria</span>
                  <ul class="space-y-2">
                    ${drug.patientEducation.map(item => `
                      <li class="text-xs text-slate-800 leading-relaxed flex items-start space-x-2">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full mt-2 flex-shrink-0"></span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                ${drug.references && drug.references.length > 0 ? `
                  <div class="border-t border-slate-200 pt-3">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Source Attributions</span>
                    <div class="space-y-1.5">
                      ${drug.references.map(ref => `
                        <div class="text-[10px] text-teal-600 font-semibold truncate">
                          ${ref.uri ? `
                            <a href="${ref.uri}" target="_blank" rel="noopener noreferrer" class="underline hover:text-teal-850 flex items-center space-x-1.5">
                              <svg class="w-3.5 h-3.5 flex-shrink-0 text-teal-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 002.502-2.502m1.07-1.912a4 4 0 015.656 0l4 4a4 4 0 01-5.656 5.656l-1.1 1.1" /></svg>
                              <span>${ref.title}</span>
                            </a>
                          ` : `
                            <div class="flex items-center space-x-1.5 text-slate-500 font-normal">
                              <span>${ref.title}</span>
                            </div>
                          `}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : ''}

          </div>
        </div>
      `;
    }

    // Module-Level Global Switch Tabs
    window.switchTab = (tabId) => {
      state.activeTab = tabId;
      state.selectedDrug = null;
      renderApp();
    };

    window.selectDrug = (drugId) => {
      state.selectedDrug = state.clinicalDrugs.find(d => d.id === drugId);
      window.drugTabState = 'summary';
      renderApp();
    };

    window.closeDrugDetail = () => {
      state.selectedDrug = null;
      renderApp();
    };

    window.setDrugDetailTab = (tabId) => {
      window.drugTabState = tabId;
      if (state.selectedDrug) {
        const container = document.getElementById('app-viewport');
        renderDrugDetail(state.selectedDrug, container);
      }
    };

    window.setCalcType = (calcId) => {
      state.calcType = calcId;
      state.calcResult = null;
      renderApp();
    };

    // Calculate dosage/rates math
    window.runCalculation = () => {
      if (state.calcType === 'drip') {
        const vol = parseFloat(document.getElementById('calc-vol')?.value);
        const hrs = parseFloat(document.getElementById('calc-time')?.value);
        const df = parseFloat(document.getElementById('calc-drop')?.value);

        if (isNaN(vol) || isNaN(hrs) || isNaN(df) || vol <= 0 || hrs <= 0) {
          state.calcResult = { error: "Parameters must be positive integers." };
          renderApp();
          return;
        }

        // Store active inputs
        state.calcInput.volume = vol;
        state.calcInput.time = hrs;
        state.calcInput.dropFactor = df;

        const mlPerHour = Math.round((vol / hrs) * 10) / 10;
        const gttsPerMin = Math.round((vol * df) / (hrs * 60));
        state.calcResult = {
          type: 'drip',
          mlPerHour,
          gttsPerMin,
          summary: `Administer continuous infusion at ${mlPerHour} mL/hr (equivalent to ${gttsPerMin} drops/minute at a set factor of ${df} drops/mL).`
        };
      } else {
        const dose = parseFloat(document.getElementById('calc-dose')?.value);
        const unit = document.getElementById('calc-unit')?.value;
        const wt = parseFloat(document.getElementById('calc-weight')?.value);
        const concV = parseFloat(document.getElementById('calc-conc-val')?.value);
        const concVol = parseFloat(document.getElementById('calc-conc-vol')?.value);

        if (isNaN(dose) || isNaN(concV) || isNaN(concVol) || dose <= 0 || concV <= 0 || concVol <= 0) {
          state.calcResult = { error: "Mass and Concentration values must be positive integers." };
          renderApp();
          return;
        }

        // Store active inputs
        state.calcInput.doseOrdered = dose;
        state.calcInput.timeUnit = unit;
        state.calcInput.weight = wt;
        state.calcInput.concentrationVal = concV;
        state.calcInput.concentrationVol = concVol;

        let hourlyDose = dose;
        if (unit === 'min') {
          hourlyDose = dose * 60;
        }

        if (wt && wt > 0) {
          hourlyDose = hourlyDose * wt;
        }

        const mlPerHour = Math.round(((hourlyDose / concV) * concVol) * 100) / 100;
        
        state.calcResult = {
          type: 'dose',
          mlPerHour,
          summary: `Deliver continuous infusion at ${mlPerHour} mL/hr to target a prescribed dosage of ${dose} ${wt ? 'mcg/kg/min' : 'mg/hr'}.`
        };
      }
      renderApp();
    };

    window.runAssistantQuery = () => {
      handleAssistantQuery();
    };

    // Device lock passcode logic
    window.pressPIN = (key) => {
      state.passcodeError = '';
      if (key === 'delete') {
        state.passcodeInput = state.passcodeInput.slice(0, -1);
        renderApp();
        return;
      }

      if (state.passcodeInput.length >= 4) return;
      state.passcodeInput += key;
      renderApp();

      if (state.passcodeInput.length === 4) {
        if (state.setupStep === 'setup-1') {
          state.tempPasscode = state.passcodeInput;
          state.setupStep = 'setup-2';
          state.passcodeInput = '';
          showBanner("Confirm passcode pattern", "info");
        } else if (state.setupStep === 'setup-2') {
          if (state.passcodeInput === state.tempPasscode) {
            localStorage.setItem('rn_passcode', state.passcodeInput);
            state.passcode = state.passcodeInput;
            state.setupStep = 'enter';
            state.isLocked = false;
            state.passcodeInput = '';
            showBanner("Access granted.", "success");
          } else {
            state.passcodeError = "Verification mismatch. Restart PIN config.";
            state.setupStep = 'setup-1';
            state.passcodeInput = '';
            state.tempPasscode = '';
          }
        } else if (state.setupStep === 'enter') {
          if (state.passcodeInput === state.passcode) {
            state.isLocked = false;
            state.passcodeInput = '';
            showBanner("Device unlocked.", "success");
          } else {
            state.passcodeError = "Invalid entry code.";
            state.passcodeInput = '';
          }
        }
        renderApp();
      }
    };

    window.signoutUser = async () => {
      try {
        await signOut(auth);
        state.user = null;
        state.isLocked = true;
        state.passcodeInput = '';
        renderApp();
        showBanner("Signed out successfully.", "info");
      } catch (err) {
        console.error("Logout failed", err);
      }
    };

    window.clearPasscode = () => {
      localStorage.removeItem('rn_passcode');
      state.passcode = '';
      state.setupStep = 'setup-1';
      state.passcodeInput = '';
      state.isLocked = true;
      renderApp();
      showBanner("PIN authorization pattern reset.", "info");
    };

    // Render Initial Login Frame
    renderApp();
  </script>
</body>
</html>
